name: Bug report
description: Report a problem with the MoM API or engine
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal request, command, or code that triggers the issue.
      placeholder: |
        1. Start server with `scripts/dev-openrouter.sh`
        2. POST to /v1/chat/completions with ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream (MOM_UPSTREAM)
      placeholder: mock | openrouter
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.1.0 or git SHA
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
