[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixtureofmodels"
version = "0.1.0"
description = "Mixture-of-Models OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "openai", "mixture-of-models", "fastapi", "openrouter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://mixtureofmodels.com"
Repository = "https://github.com/luckeyfaraday/MoM-engine"

[tool.hatch.build.targets.wheel]
packages = ["mom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
